name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Optional release signing with the upload key. Repository secrets
      # (same names as in the other app repos):
      #   KEYSTORE_BASE64    base64 of the .jks file (base64 -w0 upload-keystore.jks)
      #   KEYSTORE_PASSWORD  keystore password
      #   KEY_ALIAS          key alias, e.g. "upload"
      # The key password is the keystore password (as with keytool's default).
      # Without them the release build is signed with the debug key.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No signing secrets configured, using the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          PROPS
          echo "::notice::Release build is signed with the upload key ($KEY_ALIAS)."

      - run: flutter build apk --release --split-per-abi
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: json-viewer-apks
          path: build/app/outputs/flutter-apk/*-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: json-viewer-aab
          path: build/app/outputs/bundle/release/app-release.aab
